name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q OutlaweLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle -p OutlaweLauncher assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OutlaweLauncher-APK
          path: OutlaweLauncher/app/build/outputs/apk/debug/*.apk
